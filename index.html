
  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAI CLUB ADMIN</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#071426;
color:white;
font-family:Arial,sans-serif;
}
.header{
background:#102b49;
padding:20px;
text-align:center;
border-bottom:2px solid #00d99a;
}
.box{
background:#142d49;
padding:20px;
margin:18px auto;
width:92%;
max-width:450px;
border-radius:14px;
box-shadow:0 4px 15px #0005;
}
h2,h3{text-align:center}
input,select{
width:100%;
padding:14px;
margin:9px 0;
border:0;
border-radius:7px;
font-size:16px;
}
button{
width:100%;
padding:14px;
margin:9px 0;
background:#00d99a;
color:#071426;
font-weight:bold;
border:0;
border-radius:7px;
font-size:16px;
cursor:pointer;
}
button:active{background:#00a979}
#dashboard{display:none}
#result{
background:#071426;
padding:18px;
margin-top:15px;
border-radius:9px;
text-align:center;
line-height:2;
}
li{
padding:10px;
border-bottom:1px solid #ffffff22;
}
.notice{
color:#00e5a1;
text-align:center;
}
</style>
</head>

<body>

<div class="header">
<h1>JAI CLUB</h1>
<p>ADMIN CONTROL PANEL</p>
</div>

<div class="box" id="loginBox">
<h2>ADMIN LOGIN</h2>
<input id="admin" type="text" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button type="button" id="loginBtn">LOGIN</button>
<p id="msg"></p>
</div>

<div id="dashboard">

<div class="box">
<h2>WELCOME ADMIN</h2>
<button type="button" id="logoutBtn">LOGOUT</button>
</div>

<div class="box">
<h3>WEBSITE NOTICE</h3>
<input id="notice" placeholder="Write website notice">
<button type="button" id="saveNotice">SAVE NOTICE</button>
<p class="notice" id="noticeDisplay"></p>
</div>

<div class="box">
<h3>NUMBER ANALYSIS</h3>

<select id="period">
<option value="1 Minute">1 Minute</option>
<option value="5 Minutes">5 Minutes</option>
</select>

<button type="button" id="generateBtn">
GENERATE ANALYSIS
</button>

<div id="result">READY</div>
</div>

<div class="box">
<h3>ANALYSIS HISTORY</h3>
<ul id="history"></ul>
<button type="button" id="clearHistory">CLEAR HISTORY</button>
</div>

</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let historyData = [];

$("loginBtn").addEventListener("click", function(){

const username = $("admin").value.trim();
const password = $("pass").value;

if(username === "admin" && password === "1234"){

$("loginBox").style.display = "none";
$("dashboard").style.display = "block";
$("msg").textContent = "";

}else{

$("msg").textContent = "Wrong Username or Password";
$("msg").style.color = "red";

}

});

$("logoutBtn").addEventListener("click", function(){
$("dashboard").style.display = "none";
$("loginBox").style.display = "block";
$("pass").value = "";
});

$("saveNotice").addEventListener("click", function(){

const notice = $("notice").value.trim();

if(notice === ""){
$("noticeDisplay").textContent = "Please enter a notice";
return;
}

$("noticeDisplay").textContent = notice;

});

$("generateBtn").addEventListener("click", function(){

const number = Math.floor(Math.random()*10);

const color = [1,3,7,9].includes(number)
? "GREEN"
: [2,4,6,8].includes(number)
? "RED"
: "VIOLET";

const size = number >= 5 ? "BIG" : "SMALL";

const period = $("period").value;

const result =
"Number: " + number +
"<br>Color: " + color +
"<br>Size: " + size +
"<br>Period: " + period;

$("result").innerHTML = result;

const historyText =
"Number: " + number +
" | " + color +
" | " + size +
" | " + period;

historyData.unshift(historyText);

showHistory();

});

function showHistory(){

$("history").innerHTML = "";

historyData.forEach(function(item){

const li = document.createElement("li");
li.textContent = item;
$("history").appendChild(li);

});

}

$("clearHistory").addEventListener("click", function(){
historyData = [];
showHistory();
$("result").textContent = "READY";
});

</script>

</body>
</html>
