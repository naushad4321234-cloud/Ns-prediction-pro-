<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAI CLUB ADMIN</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#071426;color:white;
font-family:Arial,sans-serif;padding:15px
}
.header{
text-align:center;background:#102b49;
padding:15px;border-radius:12px
}
.box{
max-width:450px;margin:18px auto;
padding:20px;background:#142d49;
border-radius:14px
}
input,button{
width:100%;padding:14px;margin:8px 0;
border:0;border-radius:7px
}
button{
background:#00d99a;color:#071426;
font-weight:bold;font-size:16px
}
#dashboard{display:none}
.period{
text-align:center;background:#071426;
padding:15px;border-radius:10px;
font-size:19px
}
#timer{color:#00e5a1;font-size:30px}
#result{
background:#071426;padding:15px;
border-radius:10px;text-align:center;
line-height:2;margin-top:12px
}
li{padding:10px;border-bottom:1px solid #555}
</style>
</head>
<body>

<div class="header">
<h1>JAI CLUB</h1>
<p>ADMIN CONTROL PANEL</p>
</div>

<div class="box" id="loginBox">
<h2>ADMIN LOGIN</h2>
<input id="admin" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button type="button" id="loginBtn">LOGIN</button>
<p id="msg"></p>
</div>

<div id="dashboard">

<div class="box">
<h2>WELCOME ADMIN</h2>
<button id="logoutBtn">LOGOUT</button>
</div>

<div class="box">
<h3>LIVE PERIOD NUMBER</h3>
<div class="period">
<div id="period">Loading...</div>
<div id="timer">00:00</div>
</div>
</div>

<div class="box">
<h3>WEBSITE NOTICE</h3>
<input id="notice" placeholder="Enter notice">
<button id="saveNotice">SAVE NOTICE</button>
<p id="noticeDisplay"></p>
</div>

<div class="box">
<h3>NUMBER ANALYSIS</h3>
<button id="generateBtn">GENERATE ANALYSIS</button>
<div id="result">READY</div>
</div>

<div class="box">
<h3>ANALYSIS HISTORY</h3>
<ul id="history"></ul>
</div>

</div>

<script>
const $=id=>document.getElementById(id);
let historyData=[];

function getPeriod(){
const now=Date.now();
const minute=Math.floor(now/60000);
const date=new Date();
const day=date.getFullYear().toString()+
String(date.getMonth()+1).padStart(2,'0')+
String(date.getDate()).padStart(2,'0');

return day+"1000"+String(minute).slice(-5);
}

function updatePeriod(){
const now=new Date();
const seconds=now.getSeconds();
$("period").textContent=getPeriod();

const remaining=59-seconds;
$("timer").textContent=
"00:"+String(remaining).padStart(2,'0');
}

setInterval(updatePeriod,1000);
updatePeriod();

$("loginBtn").onclick=function(){
if($("admin").value==="admin" &&
$("pass").value==="1234"){
$("loginBox").style.display="none";
$("dashboard").style.display="block";
}else{
$("msg").textContent="Wrong Username or Password";
}
};

$("logoutBtn").onclick=function(){
$("dashboard").style.display="none";
$("loginBox").style.display="block";
$("pass").value="";
};

$("saveNotice").onclick=function(){
const value=$("notice").value.trim();
$("noticeDisplay").textContent=value || "Enter a notice first";
};

$("generateBtn").onclick=function(){

const n=Math.floor(Math.random()*10);

const color=[1,3,7,9].includes(n)
?"GREEN":[2,4,6,8].includes(n)
?"RED":"VIOLET";

const size=n>=5?"BIG":"SMALL";
const period=getPeriod();

$("result").textContent=
"Period: "+period+
" | Number: "+n+
" | Color: "+color+
" | Size: "+size;

historyData.unshift(
"Period: "+period+
" | Number: "+n+
" | "+color+
" | "+size
);

if(historyData.length>30)historyData.pop();

$("history").innerHTML="";

historyData.forEach(item=>{
const li=document.createElement("li");
li.textContent=item;
$("history").appendChild(li);
});

};
</script>

</body>
</html>
