<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS Prediction Pro</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
  text-align: center;
}
header {
  background: #111a35;
  padding: 25px 10px;
  border-bottom: 2px solid #00e5ff;
}
h1 { color: #00e5ff; }
.card {
  background: #17213d;
  margin: 25px auto;
  padding: 25px;
  width: 85%;
  max-width: 400px;
  border-radius: 15px;
}
button {
  background: #00cfa5;
  color: #06131b;
  border: none;
  padding: 13px 22px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}
#result {
  font-size: 22px;
  color: #00e5ff;
  margin-top: 20px;
}
footer { color: #aaa; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>NS PREDICTION PRO</h1>
  <p>Your Number Analysis Dashboard</p>
</header>

<div class="card">
  <h2>Welcome!</h2>
  <p>Explore number analysis and previous results.</p>
  <button onclick="showResult()">View Demo</button>
  <div id="result"></div>
</div>

<div class="card">
  <h3>Important Notice</h3>
  <p>Demo numbers are for learning only. They cannot predict guaranteed future results.</p>
</div>

<footer>NS Prediction Pro | Demo Version</footer>

<script>
function showResult() {
  document.getElementById("result").innerText =
    "Demo dashboard is working!";
}
</script>
</body>
</html>
